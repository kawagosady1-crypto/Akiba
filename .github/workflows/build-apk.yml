name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: |
          flutter create --org com.akiba --project-name akiba --platforms android .
          rm -rf test
      - name: Add Akiba's Android settings
        run: python3 tool/patch_android.py
      - run: flutter pub get
      - name: Make the app icon
        run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk Akiba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Akiba-apk
          path: Akiba.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Akiba build ${{ github.run_number }}
          files: Akiba.apk
